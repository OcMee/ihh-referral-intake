<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Referral Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<style>/* Referral Desk: coordinator view for recuperative care referrals.
   Layout: dark brand bar, then either the inbox list or the review screen (summary left, evidence panel right),
   with a sticky decision bar. Brand tokens from the OCMEE styleguide (2024): #1A1A1A, #FF8710, #FFFFFF. */
:root {
  --brand-ink: #1a1a1a; --brand-orange: #ff8710; --brand-white: #ffffff;
  --bg: #f3f2ef; --surface: #ffffff; --surface-2: #f8f7f4; --ink: #1a1a1a; --mute: #5c5f66; --faint: #8a8d93;
  --line: #e3e1dc; --line-strong: #cfccc4; --accent: #c25e00; --focus: #ff8710;
  --ok: #17734a; --ok-bg: #e4f2ea; --warn: #9a5b00; --warn-bg: #fcefd9; --bad: #b3261e; --bad-bg: #fbe8e6;
  --gray: #5f6670; --gray-bg: #ebecee; --mark: #ffd9a8; --track: #e6e3dd; --paper: #fbfaf6; --paper-ink: #2a2a2a;
  --cond: "Montserrat", "IBM Plex Sans", Arial, sans-serif;
  --sans: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --brand-amber: #faac23;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121212; --surface: #1b1b1c; --surface-2: #222224; --ink: #ecebe8; --mute: #a7a9ad; --faint: #7d8086;
  --line: #2e2e31; --line-strong: #3d3d41; --accent: #ff9a3d;
  --ok: #5fcf93; --ok-bg: #16301f; --warn: #f2b65a; --warn-bg: #33270f; --bad: #ff8a7a; --bad-bg: #3b1916;
  --gray: #a5abb4; --gray-bg: #26292d; --mark: #6b4210; --track: #2c2c2f; --paper: #202022; --paper-ink: #e4e2dc; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1b1b1c; --surface-2: #222224; --ink: #ecebe8; --mute: #a7a9ad; --faint: #7d8086;
  --line: #2e2e31; --line-strong: #3d3d41; --accent: #ff9a3d;
  --ok: #5fcf93; --ok-bg: #16301f; --warn: #f2b65a; --warn-bg: #33270f; --bad: #ff8a7a; --bad-bg: #3b1916;
  --gray: #a5abb4; --gray-bg: #26292d; --mark: #6b4210; --track: #2c2c2f; --paper: #202022; --paper-ink: #e4e2dc; color-scheme: dark }

* { box-sizing: border-box }
html { background: var(--bg) }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased }
a { color: var(--accent); text-decoration: none } a:hover { text-decoration: underline }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* brand bar */
.bar { background: var(--brand-ink); color: var(--brand-white); border-bottom: 3px solid var(--brand-orange); position: sticky; top: 0; z-index: 20 }
.bar-in { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 14px; min-height: 52px; padding-block: 8px; flex-wrap: wrap }
.logo { font-weight: 700; letter-spacing: .02em; font-size: 15px; white-space: nowrap }
.logo b { color: var(--brand-orange) } .logo span { color: #9a9a9a; font-weight: 400; font-size: 12px; margin-left: 8px }
.bar .crumb { color: #d6d6d6; font-size: 13px; display: flex; gap: 8px; align-items: center; min-width: 0 }
.bar .crumb a { color: #fff } .bar .sp { flex: 1 }
.bar .tag { font-size: 11px; border: 1px solid #555; color: #ddd; border-radius: 999px; padding: 2px 9px; white-space: nowrap }
.bar .tag.real { border-color: var(--brand-orange); color: var(--brand-orange) }
.iconbtn { background: transparent; border: 1px solid #444; color: #ddd; border-radius: 6px; padding: 4px 9px; font-size: 12px }
.iconbtn:hover { border-color: var(--brand-orange); color: #fff }

.notice { max-width: 1440px; margin: 12px auto 0; }
.notice div { background: var(--warn-bg); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: var(--r); padding: 8px 12px; font-size: 13px; font-weight: 600 }

main { max-width: 1440px; margin: 0 auto; padding-block: 16px 120px }

/* inbox */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 6px 0 14px }
.hero h1 { font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance }
.hero p { margin: 4px 0 0; color: var(--mute); max-width: 70ch }
.stats { display: flex; gap: 8px; flex-wrap: wrap }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; min-width: 96px }
.stat .v { font: 600 20px/1.1 var(--mono) } .stat .k { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em }
.stat.bad .v { color: var(--bad) } .stat.warn .v { color: var(--warn) } .stat.ok .v { color: var(--ok) }

.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--mute) }
.seg button.on { background: var(--ink); color: var(--bg) }
.search { flex: 1; min-width: 180px; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--ink); font: inherit }
select.sort { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; color: var(--ink); font: inherit; font-size: 13px }
label.toggle { font-size: 13px; color: var(--mute); display: inline-flex; gap: 6px; align-items: center }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.row { display: grid; grid-template-columns: 64px 74px minmax(0, 1fr) 150px 130px 110px; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; width: 100% }
.row:first-child { border-top: 0 } .row:hover { background: var(--surface-2) }
.row .id { font: 600 13px var(--mono) }
.row .who { min-width: 0 } .row .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .who small { color: var(--mute); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .bl { font-size: 12px; color: var(--bad); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.row .bl.none { color: var(--faint) }
.head { cursor: default; background: var(--surface-2); font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; padding-block: 8px }
.head:hover { background: var(--surface-2) }
.score { display: inline-flex; align-items: center; gap: 8px }
.pill { display: inline-block; min-width: 38px; text-align: center; border-radius: 999px; padding: 2px 8px; font: 600 12px var(--mono) }
.pill.fit { background: var(--ok-bg); color: var(--ok) } .pill.info { background: var(--warn-bg); color: var(--warn) } .pill.nofit { background: var(--bad-bg); color: var(--bad) }
.lbl { font-size: 12px; color: var(--mute) }
.clock { font: 500 12px var(--mono); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.clock i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block }
.clock.soon i { background: var(--warn) } .clock.over { color: var(--bad) } .clock.over i { background: var(--bad) }
.done { font-size: 12px; border-radius: 6px; padding: 2px 8px; background: var(--gray-bg); color: var(--gray); white-space: nowrap }
.done.approve { background: var(--ok-bg); color: var(--ok) } .done.deny { background: var(--bad-bg); color: var(--bad) } .done.info { background: var(--warn-bg); color: var(--warn) }
.ihh { font-size: 11px; color: var(--mute) }
.empty { padding: 28px; text-align: center; color: var(--mute) }
.foot { color: var(--faint); font-size: 12px; margin-top: 14px; max-width: 90ch }

/* review */
.review { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px }
.review.withpanel { grid-template-columns: minmax(0, 1fr) minmax(320px, 40%) }
.title { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 12px }
.title h1 { font-size: 21px; margin: 0; line-height: 1.25; text-wrap: balance }
.title .meta { color: var(--mute); font-size: 13px; margin-top: 4px }
.grid3 { display: grid; grid-template-columns: minmax(0, 1fr) 230px minmax(0, 1fr); gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0 }
.card h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 0 0 10px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline }
.card h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint) }
.facts { list-style: none; margin: 0; padding: 0 }
.facts li { padding: 7px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px }
.facts li:first-child { border-top: 0; padding-top: 0 }
.facts .k { color: var(--mute); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px }
.pg { font: 500 11.5px var(--mono); color: var(--accent); background: transparent; border: 0; padding: 0 2px; white-space: nowrap }
.pg:hover { text-decoration: underline }
.vf { color: var(--ok); font-size: 11px } .ck { color: var(--warn); font-size: 10.5px; font-weight: 700 }
.ringbox { display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: flex-start }
.withpanel .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
.withpanel .grid3 .ringbox { grid-column: 1 / -1; order: -1; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 6px 18px; text-align: left }
.withpanel .grid3 .ringbox svg { width: 120px; height: 120px }
.withpanel .grid3 .ringbox .second { flex: 1 1 260px; margin: 0; padding: 0 0 0 16px; border-top: 0; border-left: 1px dashed var(--line-strong); width: auto }
.withpanel .grid3 .ringbox .why { flex-basis: 100% }
.band { font-weight: 700; font-size: 15px; margin-top: 2px }
.second { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong); font-size: 12.5px; color: var(--mute); width: 100% }
.second b { color: var(--ink) }
.why { margin-top: 10px; font-size: 12px; color: var(--mute); text-align: left; width: 100% }
.why summary { cursor: pointer; color: var(--accent) }
.why ul { margin: 6px 0 0; padding-left: 16px } .why li { font-family: var(--mono); font-size: 11.5px }
.block { border: 1px solid var(--bad); background: var(--bad-bg); border-radius: var(--r); padding: 9px 11px; margin-bottom: 8px }
.block b { color: var(--bad) } .block.maybe { border-color: var(--warn); background: var(--warn-bg) } .block.maybe b { color: var(--warn) }
.q { color: var(--mute); font-style: italic }
.clear { color: var(--ok); font-weight: 600; margin-bottom: 8px }
.conf { padding: 7px 0; border-top: 1px solid var(--line) } .conf:first-of-type { border-top: 0 }
.conf b { font-weight: 600 }
.crit .sec { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-top: 1px solid var(--line) }
.crit .sec .n { color: var(--mute); font-size: 11.5px; font-weight: 600; padding-top: 4px }
.chips { display: flex; flex-wrap: wrap; gap: 5px }
.chip { display: inline-flex; gap: 5px; align-items: center; border-radius: 999px; padding: 3px 9px; font-size: 12px; border: 1px solid transparent; background: var(--gray-bg); color: var(--gray) }
.chip .rid { font: 600 10.5px var(--mono); opacity: .85 }
.chip.met { background: var(--ok-bg); color: var(--ok) } .chip.not_met { background: var(--bad-bg); color: var(--bad); border-color: var(--bad) }
.chip.unknown { background: var(--warn-bg); color: var(--warn) } .chip.cant_tell { background: var(--gray-bg); color: var(--gray) }
.chip:hover { filter: brightness(.96) }
.legend { font-size: 11.5px; color: var(--mute); font-weight: 400; text-transform: none; letter-spacing: 0 }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; margin-top: 12px }
.miss span { display: inline-block; background: var(--gray-bg); border-radius: 6px; padding: 3px 8px; margin: 0 5px 5px 0; font-size: 12.5px }
ol.qs { margin: 0; padding-left: 20px } ol.qs li { margin-bottom: 4px }
.stack { display: grid; gap: 12px; margin-top: 12px }

/* evidence panel */
.panel { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 160px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden }
.panel .ph { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2) }
.panel .ph b { font-size: 13px } .panel .ph .sp { flex: 1 }
.panel .ph button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: 3px 8px; font-size: 12px }
.panel .rulebox { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px }
.panel .rulebox .t { color: var(--mute); margin-top: 4px }
.panel .body { overflow: auto; padding: 12px }
.panel img { width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff }
.panel pre { white-space: pre-wrap; font: 12.5px/1.55 var(--mono); margin: 0 }
.panel mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px }
.panel .tabs { display: flex; gap: 6px; margin-bottom: 8px }
.panel .tabs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--mute) }
.panel .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* decision bar */
.decide { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line-strong); box-shadow: 0 -6px 18px rgba(0,0,0,.06); padding-bottom: env(safe-area-inset-bottom, 0px) }
.decide-in { max-width: 1440px; margin: 0 auto; display: flex; gap: 8px; align-items: center; padding-block: 10px; flex-wrap: wrap }
.decide .lead { font-size: 13px; color: var(--mute); margin-right: auto }
.btn { border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; border: 1px solid var(--line-strong); background: var(--surface) }
.btn.approve { border-color: var(--ok); color: var(--ok) } .btn.approve.on, .btn.approve:hover { background: var(--ok); color: var(--surface) }
.btn.info { border-color: var(--warn); color: var(--warn) } .btn.info.on, .btn.info:hover { background: var(--warn); color: var(--surface) }
.btn.deny { border-color: var(--bad); color: var(--bad) } .btn.deny.on, .btn.deny:hover { background: var(--bad); color: var(--surface) }
.btn.primary { background: var(--brand-ink); color: var(--brand-white); border-color: var(--brand-ink) }
.drawer { max-width: 1440px; margin: 0 auto; padding-block: 0 12px }
.drawer textarea { width: 100%; min-height: 160px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px; font: 13px/1.5 var(--mono); background: var(--surface-2); color: var(--ink) }
.drawer .row2 { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap }
.drawer .hint { font-size: 12px; color: var(--mute); margin-right: auto }

@media (max-width: 1100px) { .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } .grid3 .ringbox { grid-column: 1 / -1; order: -1; flex-direction: row; flex-wrap: wrap; gap: 6px 18px; text-align: left } .review.withpanel { grid-template-columns: minmax(0, 1fr) } .panel { position: fixed; inset: auto 0 0 0; top: 64px; max-height: none; border-radius: 12px 12px 0 0; z-index: 30 } }
@media (max-width: 760px) {
  .row { grid-template-columns: 52px minmax(0, 1fr) auto; grid-template-areas: "id who score" "id bl clock"; row-gap: 4px }
  .row .id { grid-area: id } .row .who { grid-area: who } .row .score { grid-area: score } .row .bl { grid-area: bl } .row .clock { grid-area: clock } .row .dcol, .row .pgs { display: none }
  .head { display: none }
  .grid3, .two { grid-template-columns: minmax(0, 1fr) } .crit .sec { grid-template-columns: minmax(0, 1fr) } .facts li { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
@media print { .bar, .decide, .panel, .tools { display: none !important } body, html { background: #fff } main { padding: 0 } }


/* ===== v2: triage board ===== */
h1, h2, .lane header b, .title h1 { font-family: var(--cond); letter-spacing: -.005em }
.eyebrow { font: 600 11.5px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px }
.hero2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: end; margin: 8px 0 18px }
.hero2 h1 { font-size: clamp(28px, 3.4vw, 44px); line-height: 1.05; margin: 0; font-weight: 700; text-wrap: balance; max-width: 18ch }
.hero2 .lede { color: var(--mute); margin: 10px 0 0; max-width: 60ch; font-size: 15px }
.pipe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--brand-ink); color: #f1efea; border-radius: 12px; overflow: hidden; border-bottom: 3px solid var(--brand-orange) }
.pipe > div { padding: 14px 16px; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.pipe > div:first-child { border-left: 0 }
.pipe .step { font: 600 11px var(--mono); letter-spacing: .1em; color: var(--brand-orange); text-transform: uppercase }
.pipe .num { font-size: 30px; font-weight: 600; line-height: 1.1 } .pipe .num em { font-style: normal; color: #8d8a84; font-size: 18px }
.pipe small { color: #b9b5ad; font-size: 12px }
.pipe .hot { background: #232323 }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start }
.lane { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0 }
.lane header { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px }
.lane header i { width: 10px; height: 10px; border-radius: 3px; background: var(--gray) }
.lane.nofit header i { background: var(--bad) } .lane.info header i { background: var(--warn) } .lane.fit header i { background: var(--ok) }
.lane header b { display: block; font-size: 17px; font-weight: 700 } .lane header small { color: var(--mute); font-size: 12px }
.lane header .num { margin-left: auto; font-size: 13px; color: var(--mute); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px }
.cards { display: grid; gap: 8px }
.card2 { display: grid; gap: 9px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gray); border-radius: 10px; padding: 11px 12px; transition: transform .12s ease, box-shadow .12s ease }
.card2:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(20, 20, 20, .08) }
.card2.nofit { border-left-color: var(--bad) } .card2.info { border-left-color: var(--warn) } .card2.fit { border-left-color: var(--ok) }
.card2.decided { opacity: .62 }
.c-top { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.c-top .id { font: 600 12.5px var(--mono); letter-spacing: .04em }
.c-main { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center }
.c-who { min-width: 0 } .c-who b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; line-height: 1.3 }
.c-who small { display: block; color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px }
.c-bl { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px }
.tagx { font: 600 10.5px var(--mono); color: var(--bad); background: var(--bad-bg); border-radius: 4px; padding: 2px 6px }
.tagx.more { color: var(--mute); background: var(--gray-bg) }
.calm { font-size: 12px; color: var(--ok); font-weight: 600 }
.c-foot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center }
.sla { height: 5px; background: var(--track); border-radius: 999px; overflow: hidden }
.sla i { display: block; height: 100%; background: var(--ok); border-radius: 999px } .sla.soon i { background: var(--warn) } .sla.over i { background: var(--bad) }
.lane .empty { padding: 18px; font-size: 13px }

/* review */
.title { position: relative; padding-left: 16px } .title::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 5px; border-radius: 3px; background: var(--gray) }
.title.band-nofit::before { background: var(--bad) } .title.band-info::before { background: var(--warn) } .title.band-fit::before { background: var(--ok) }
.title h1 { font-size: 26px; font-weight: 700 }
.card h2 { font-family: var(--mono); font-weight: 600; letter-spacing: .12em; font-size: 10.5px }
.gauge { display: block }
.crit .sec .n { display: flex; flex-direction: column; gap: 6px }
.sbar { display: flex; height: 5px; width: 100%; max-width: 110px; border-radius: 999px; overflow: hidden; background: var(--track) }
.sbar i { display: block; height: 100% } .sbar .met { background: var(--ok) } .sbar .unknown { background: var(--warn) } .sbar .not_met { background: var(--bad) }
.chip { transition: transform .1s ease } .chip:hover { transform: translateY(-1px) }

/* evidence panel as a fax sheet */
.panel .body { background: var(--surface-2) }
.panel pre { background: var(--paper); color: var(--paper-ink); border: 1px solid var(--line); border-radius: 4px; padding: 22px 22px 26px; box-shadow: 0 1px 0 var(--line), 0 10px 24px rgba(0, 0, 0, .06); font-size: 12.5px }
.panel mark { background: var(--mark); box-shadow: 0 0 0 2px var(--mark); border-radius: 2px }
.panel .ph b { font-family: var(--mono); font-size: 12px; letter-spacing: .04em }

@media (max-width: 900px) { .hero2 { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 520px) { .pipe { grid-template-columns: minmax(0, 1fr) } .pipe > div { border-left: 0; border-top: 1px solid #333 } .pipe > div:first-child { border-top: 0 } }


/* ===== v3: ocmeed.com look (dark hero card, orange stat tile, geometric headings) ===== */
.logo { display: inline-flex; align-items: baseline; gap: 6px; font-family: var(--cond); color: #fff }
.logo b { color: var(--brand-orange); font-weight: 800; letter-spacing: .18em; font-size: 17px }
.logo i { font-style: normal; color: var(--brand-orange); font-weight: 600; letter-spacing: .32em; font-size: 10.5px }
.logo span { font-family: var(--sans) }
.hero2 { background: radial-gradient(120% 140% at 85% 0%, #2b2b2b 0%, var(--brand-ink) 55%); color: #f3f1ec; border-radius: 22px; padding: 28px 28px 28px 32px; margin: 14px 0 18px; align-items: center; box-shadow: 0 18px 40px rgba(0, 0, 0, .12) }
.hero2 h1 { color: #fff; font-weight: 700; font-size: clamp(30px, 3.6vw, 48px); letter-spacing: -.01em }
.hero2 .lede { color: #c9c5bd }
.hero2 .eyebrow { color: var(--brand-orange) }
.pipe { background: transparent; border: 0; border-radius: 16px; gap: 8px; overflow: visible }
.pipe > div { background: #232323; border: 1px solid #333; border-radius: 16px; padding: 16px 18px }
.pipe > div:first-child { background: var(--brand-orange); border-color: var(--brand-orange) }
.pipe > div:first-child .step, .pipe > div:first-child small, .pipe > div:first-child .num { color: var(--brand-ink) }
.pipe .num { font-family: var(--cond); font-weight: 300; font-size: 40px; letter-spacing: -.01em }
.pipe .hot { background: #1f1f1f }
.lane { border-radius: 18px; padding: 12px }
.card2 { border-radius: 14px }
.card, .list { border-radius: 16px }
.btn.primary { background: var(--brand-orange); color: var(--brand-ink); border-color: var(--brand-orange) }
.btn.primary:hover { filter: brightness(.95) }
.seg button.on { background: var(--brand-ink); color: #fff }
:root[data-theme="dark"] .seg button.on { background: var(--brand-orange); color: var(--brand-ink) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on { background: var(--brand-orange); color: var(--brand-ink) } }
@media (max-width: 520px) { .pipe > div { border-top: 1px solid #333 } .hero2 { padding: 22px 18px } }
@media (max-width: 640px) { .logo span { display: none } .bar .tag { display: none } }

/* ocmeed.com (from the site PDFs): Montserrat throughout, orange #FF860F + amber #FAAC23 */
body { font-size: 13.5px }
.pipe > div:first-child { background: linear-gradient(135deg, var(--brand-orange), var(--brand-amber)); border-color: var(--brand-amber) }
.hero2 .lede { font-weight: 400 }

.pdfv { display: block; width: 100%; height: calc(100vh - 290px); min-height: 520px; border: 1px solid var(--line); border-radius: 6px; background: #fff }
.title .meta .btn { padding: 5px 11px; font-size: 12.5px; margin-right: 8px }

.proof { width: 100%; text-align: left; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-strong) }
.proof .eyebrow { margin-bottom: 8px }
.pf-row { display: grid; gap: 6px }
.pf { display: grid; grid-template-columns: 1fr; padding: 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--brand-orange); border-radius: 8px; background: var(--surface-2); color: var(--ink); text-decoration: none }
.pf:hover { border-color: var(--brand-orange); text-decoration: none }
.pf b { font-size: 13px } .pf small { color: var(--mute); font-size: 11.5px }
.pf-check { font-size: 12px; color: var(--mute); margin: 8px 0 0 }
.withpanel .grid3 .ringbox .proof { flex-basis: 100%; border-top: 1px dashed var(--line-strong) }
.withpanel .grid3 .ringbox .pf-row { grid-template-columns: repeat(3, minmax(0, 1fr)) }

.ringbox .proof { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line-strong) }
.ringbox .second { margin-top: 12px }

/* bigger decision bar */
.decide-in { padding-block: 14px; gap: 12px }
.decide .lead { font-size: 15px; color: var(--ink) }
.decide .btn { font-size: 17px; font-weight: 700; padding: 14px 28px; border-width: 2px; border-radius: 12px; min-height: 54px }
.decide .btn.approve { background: var(--ok-bg) } .decide .btn.info { background: var(--warn-bg) } .decide .btn.deny { background: var(--bad-bg) }
.decide .btn.approve.on, .decide .btn.approve:hover { background: var(--ok); color: var(--surface) }
.decide .btn.info.on, .decide .btn.info:hover { background: var(--warn); color: var(--surface) }
.decide .btn.deny.on, .decide .btn.deny:hover { background: var(--bad); color: var(--surface) }
.drawer textarea { font-size: 14px; min-height: 190px }
main { padding-block-end: 150px }
@media (max-width: 760px) { .decide-in { gap: 6px; padding-block: 10px } .decide .btn { flex: 1 1 0; padding: 10px 4px; font-size: 15px; min-height: 50px; white-space: nowrap } .decide .lead { flex-basis: 100%; font-size: 13px } }

/* intake: drag-and-drop, only with the local server */
.intake { margin: 0 0 16px; display: grid; gap: 10px }
.drop { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 22px 16px; border: 2px dashed var(--brand-orange); border-radius: 16px; background: var(--surface); cursor: pointer; transition: background .15s }
.drop b { font-size: 17px } .drop small { color: var(--mute); max-width: 62ch }
.drop:hover, .drop.over { background: var(--warn-bg) }
.intake .warn { color: var(--bad) }
.job { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.job.error { border-color: var(--bad) } .job.done { border-color: var(--ok) }
.j-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap } .j-top span { color: var(--mute); overflow-wrap: anywhere } .j-top .btn { margin-left: auto }
.j-steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 10px 0 4px }
.j-steps li { font-size: 12.5px; padding: 4px 10px; border-radius: 99px; background: var(--gray-bg); color: var(--mute) }
.j-steps li.ok { background: var(--ok-bg); color: var(--ok) } .j-steps li.ok::before { content: "✓ " }
.j-steps li.now { background: var(--warn-bg); color: var(--warn); font-weight: 600 } .j-steps li.now::before { content: "● " }
.j-steps li.bad { background: var(--bad-bg); color: var(--bad); font-weight: 600 } .j-steps li.bad::before { content: "✕ " }

/* who is reviewing */
.eyebrow.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px }
.who-edit { font: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 99px; padding: 2px 10px; cursor: pointer; opacity: .8 }
.who-edit:hover { opacity: 1 }
.who-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
.who-form input, .who-form select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid #555; background: #2a2a2a; color: #f3f1ec; min-width: 0 }
.who-form input { flex: 1 1 160px }

/* demo sign-in */
.login { display: grid; place-items: center; min-height: 62vh; padding: 24px 0 }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; box-shadow: 0 18px 40px rgba(0,0,0,.08) }
.login-card h1 { margin: 6px 0 18px; font-size: 28px }
.login-card form { display: grid; gap: 14px; margin-bottom: 14px }
.login-card label { display: grid; gap: 6px; font-size: 13px; font-weight: 600 }
.login-card input { font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink) }
.login-card .btn.primary { min-height: 48px; font-size: 16px; font-weight: 700 }
.l-err { color: var(--bad); font-size: 14px; margin: 0 }

/* intake source labels */
.src { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--gray-bg); color: var(--ink); font-weight: 600 }
.src.fax { background: #fde7cf; color: #8a4500 } .src.email { background: #e3ecfb; color: #234c8f } .src.portal { background: var(--ok-bg); color: var(--ok) } .src.folder { background: #efe8f7; color: #5b3a8a }
.c-top .src { margin-right: auto; margin-left: 8px }
.meta.arrival { margin-top: 4px } .intake .channels a { color: var(--brand-orange); font-weight: 600 }

/* front-page recap */
.recap { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 14px }
.rc { font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; padding: 10px 16px; border-radius: 14px; border: 1px solid #3a3a3a; background: #232323; color: #f3f1ec; cursor: pointer }
.rc .num { font-size: 28px; font-weight: 600 } .rc:hover { border-color: var(--brand-orange) }
.rc.fit .num { color: #4cc38a } .rc.nofit .num { color: #ff7a6e } .rc.info .num { color: var(--brand-amber) }
.hero2 .lede .soon { color: var(--brand-amber) }

18\nDOB: 02/17/2002\nSex: Male\nPreferred Language: English\nEthnicity: Hispanic or Latino\nMarital Status: Single\nAddress: NO FIXED ADDRESS (homeless)\nMailing: 1234 Example Ave, Santa Ana, CA 92700 (shelter mail drop)\nPhone: 555-0100 (message)\n## Encounter\nAdmit Date/Time: 09/01/2026 04:20\nAdmit Type: Inpatient\nUnit/Bed: 5M-509\nAttending: Fumiko Nakamura, MD\n## Insurance\nPrimary: Orange Coast Health Plan (fictional) - Medi-Cal\nSubscriber: Self\n## Emergency Contact\nNone listed\n## Alerts\nBehavioral alert: YES (added 09/03/2026)\nSecurity flag: YES\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":5,"title":"History and Physical - page 1","doc_type":"h_and_p","text":"## HISTORY AND PHYSICAL\nDate: 09/01/2026\n## CC\nCut on L arm, now red and swollen\n## HPI\n24 y/o M, unhoused, reports he fell onto a broken bottle 3 days ago. Wound not cleaned. Now erythema, swelling and purulent drainage. Pt is guarded, gives limited history. Reports he \"used to take a pill for my head\" (prior risperidone per outside med list), stopped ~3 months ago.\n## PMH\n- Schizophrenia (per outside records, dx 2021; prior psych hospitalization x2)\n## Meds PTA\n- None (prior risperidone 2 mg BID - not taking)\n## Allergies\nNKDA\n## Social\nUnhoused since age 19, multiple episodes. Cannabis daily, methamphetamine \"sometimes\" (last 1 wk ago). EtOH occasional.\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":6,"title":"History and Physical - page 2","doc_type":"h_and_p","text":"## Exam\nT 100.6F HR 106 BP 132/80 RR 18 SpO2 99% RA\nL dorsal forearm: 6 cm laceration with purulent drainage, surrounding erythema 8 cm, no foreign body on XR, tendons intact\nPsych: guarded, internally preoccupied at times, AOx4\n## Assessment/Plan\n1. Infected L forearm laceration with cellulitis - irrigation and debridement at bedside, delayed primary closure 09/02, IV cefazolin then PO\n2. Schizophrenia, off meds - psych consult if behavioral concerns\n3. Substance use - UDS, SW consult\nSigned: Fumiko Nakamura, MD 09/01/2026 07:30\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":7,"title":"Nursing note - behavioral event","doc_type":"nursing_note","text":"## NURSING NOTE - BEHAVIORAL EVENT\nDate/Time: 09/03/2026 23:15\nPt became agitated when asked to return to room after being found in another pt's room. Pt yelled profanities and threats at RN (\"I'll f--- you up\"), threw meal tray toward RN (missed, struck wall). Code Gray called; security to bedside 23:18.\nPt stated voices were \"telling me you're poisoning me.\"\nCharge RN and MD notified. Olanzapine 5 mg IM x1 given 23:35 per order. Pt calmed by 00:10.\n1:1 sitter initiated. Behavioral alert placed in chart.\nIncident report filed.\nSigned: D. Achebe, RN / Charge RN P. Lyons\n## NURSING NOTE 09/04/2026 14:00\nPt verbally aggressive toward CNA during vitals, refused, security on standby. Remains on 1:1.\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":8,"title":"Psychiatry consult","doc_type":"psych_consult","text":"## PSYCHIATRY CONSULTATION\nDate: 09/04/2026 10:30\nReason: agitation, aggression toward staff 09/03, hx schizophrenia off meds\n## Interview\nPt guarded, intermittently responding to internal stimuli. Endorses auditory hallucinations x weeks: male voices that \"tell me to hurt people who are trying to poison me\", including staff. Reports he sometimes \"has to listen.\" Denies SI. Denies plan to harm specific person \"right now.\" Poor insight.\nMSE: disheveled, psychomotor restless, speech pressured, mood \"annoyed\", affect irritable, thought process tangential, + paranoid delusions, + command AH, cognition grossly intact, AOx4. Judgment/insight poor.\n## Assessment\nSchizophrenia, acute exacerbation in setting of medication nonadherence and methamphetamine use. Command auditory hallucinations to harm others. Aggression toward staff 09/03 and 09/04.\n## Recommendations\n- Restart risperidone 1 mg PO BID, titrate to 2 mg BID\n- Olanzapine 5 mg IM/PO q6h PRN severe agitation\n- Continue 1:1 sitter\n- 5150 evaluation: does not meet criteria at this exact time; reassess daily; low threshold\n- Recommend psychiatric stabilization before discharge to any congregate setting\nSigned: G. Iqbal, MD (Psychiatry)\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":9,"title":"Hospitalist progress note","doc_type":"progress_note","text":"## HOSPITALIST PROGRESS NOTE - HD#5\nDate: 09/05/2026 07:50\nS: Pt slept 4 hrs. Took risperidone last night. Refused AM labs.\nO: T 98.4F HR 88 BP 128/78. Wound: sutures intact, erythema resolved to 2 cm. AOx4. Remains on 1:1.\nA/P:\n1. Cellulitis L forearm - improved, cephalexin 500 mg PO QID through 09/08\n2. Schizophrenia exacerbation - per psych, risperidone started 09/04; continue 1:1\n3. Dispo - medically stable from infection standpoint. CM pursuing recuperative care.\nSigned: Fumiko Nakamura, MD\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":10,"title":"Vitals and labs","doc_type":"vitals","text":"## VITAL SIGNS - LAST 5 SETS\nDate/Time | Temp (F) | HR | BP | RR | SpO2 | O2\n09/03 20:00 | 98.6 | 96 | 136/84 | 18 | 99% | RA\n09/04 08:00 | 98.2 | 92 | 130/80 | 16 | 99% | RA\n09/04 14:00 | -- | -- | -- | -- | -- | refused\n09/04 20:00 | 98.5 | 90 | 128/76 | 16 | 98% | RA\n09/05 07:50 | 98.4 | 88 | 128/78 | 16 | 99% | RA\n## LABS\n09/01 | WBC 15.2 H | Hgb 14.6 | Plt 260 | Cr 0.9\n09/03 | WBC 9.4\n09/01 UDS: + cannabinoids, + amphetamines\n09/01 Wound cx: Strep pyogenes (GAS), pan-sensitive\n09/01 MRSA nares PCR: Negative\n09/05 SARS-CoV-2 rapid antigen: Not collected (pt refused 09/05 AM)\n09/01 L forearm XR: no foreign body, no fracture\n\n-- FICTIONAL DEMO RECORD - not a real patient --"},{"page":11,"title":"Medication list","doc_type":"med_list","text":"## CURRENT MEDICATIONS / ANTICIPATED DISCHARGE\nPatient: Kevin Doe  MRN: SC-5072218\n- Cephalexin 500 mg PO four times daily through 09/08/2026\n- Risperidone 1 mg PO BID (NEW 09/04/2026), titration per psychiatry\n- Acetaminophen 650 mg PO q6h PRN pain\n## Inpatient PRN\n- Olanzapine 5 mg IM/PO q6h PRN severe agitation (given 09/03 23:35)\n\n-- FICTIONAL DEMO RECORD - not a real patient --"}]}]};</script>

  (function () { var m = (window.APP && window.APP.meta) || {}; var t = document.getElementById("mode");
    t.textContent = m.real ? "Real packets · local only" : "Fictional demo data"; if (m.real) t.classList.add("real");

<script>/* Referral Desk. Reads window.APP (written by src/build_app.py) and renders:
   #/            inbox with 2-hour countdowns
   #/D01         review: summary, criteria, evidence panel, decision + reply draft
   Decisions live only in this browser (localStorage). Nothing is ever sent. */
(function () {
  const APP = window.APP || { packets: [], meta: {} };
  const P = APP.packets;
  const byId = Object.fromEntries(P.map(p => [p.id, p]));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ICON = { met: "✓", not_met: "✕", unknown: "?", cant_tell: "⌛" };
  const BAND = { fit: "var(--ok)", info: "var(--warn)", nofit: "var(--bad)" };
  const SLA = 120; // IHH answers hospitals within 2 hours
  const LOADED = Date.now();

  const store = {
    get() { try { return JSON.parse(localStorage.getItem("referral-desk") || "{}") } catch (e) { return {} } },
    set(v) { try { localStorage.setItem("referral-desk", JSON.stringify(v)) } catch (e) { /* private mode: keep in memory */ } mem = v },
  };
  let mem = store.get();
  const decisions = () => mem;

  const ui = { filter: "all", sort: "deadline", q: "", showIhh: false, panel: null, drawer: null };

  // who is reviewing: kept in this browser only, stamped on every saved decision and reply
  const ROLES = ["Referral coordinator", "RN", "LVN", "Medical director", "Case manager"];
  // Demo sign-in. The check runs in the browser, so it keeps casual viewers out and nothing more.
  // A real deployment would use IHH's own sign-in. Passwords are stored as salted SHA-256, not in plain text.
  const ACCOUNTS = [{ email: "cornel@ocmeed.com", name: "Dr Cornel Manole", role: "Referral coordinator", salt: "ihh-desk-demo-1",
    hash: "039022d0783fe2c200f58e8038fbaffd1c648700f25a35290d6af7f2b20ed5e0" }];
  let session = null;
  try { session = JSON.parse(sessionStorage.getItem("referral-desk-session") || "null") } catch (e) { /* not signed in */ }
  let who = session ? { name: session.name, role: session.role } : { name: "", role: "Referral coordinator" };
  try { if (session) who = { ...who, ...JSON.parse(localStorage.getItem("referral-desk-user:" + session.email) || "{}") } } catch (e) { /* keep account default */ }
  async function sha256(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("") }
  function loginView() {
    return `<section class="login"><div class="login-card">
      <p class="eyebrow">Referral Desk · Illumination Health + Home</p><h1>Sign in</h1>
      <form id="login" autocomplete="on">
        <label>Email<input id="l-email" type="email" autocomplete="username" required></label>
        <label>Password<input id="l-pass" type="password" autocomplete="current-password" required></label>
        ${ui.loginError ? `<p class="l-err" role="alert">${esc(ui.loginError)}</p>` : ""}
        <button class="btn primary" type="submit">Sign in</button></form>
      <p class="lbl">Demo sign-in for the prototype: it runs in this browser and is not real security. A real deployment would use IHH’s own sign-in. Judges: the demo account is in the project README.</p></div></section>`;
  }
  document.addEventListener("submit", async e => {
    if (e.target.id !== "login") return; e.preventDefault();
    const email = $("#l-email").value.trim().toLowerCase(), pass = $("#l-pass").value;
    const a = ACCOUNTS.find(x => x.email === email);
    let ok = false; try { ok = !!a && await sha256(a.salt + ":" + pass) === a.hash } catch (err) { ui.loginError = "This browser cannot check the password here. Open the page over https or localhost."; return render() }
    if (!ok) { ui.loginError = "Email or password not recognized."; return render() }
    session = { email: a.email, name: a.name, role: a.role };
    try { sessionStorage.setItem("referral-desk-session", JSON.stringify(session)) } catch (err) { /* keep in memory */ }
    who = { name: a.name, role: a.role };
    try { who = { ...who, ...JSON.parse(localStorage.getItem("referral-desk-user:" + a.email) || "{}") } } catch (err) { /* keep */ }
    ui.loginError = null; render();
  });
  const sign = () => `${who.name}, ${who.role}\nIllumination Health + Home`;
  function whoBar() {
    if (!ui.editWho) return `<p class="eyebrow who">Welcome back, ${esc(who.name)} · ${esc(who.role)} <button class="who-edit" data-who>Change</button><button class="who-edit" data-signout>Sign out</button></p>`;
    return `<div class="who-form"><input id="who-name" value="${esc(who.name)}" aria-label="Your name" placeholder="Your name">
      <select id="who-role" aria-label="Your role">${ROLES.map(r => `<option ${r === who.role ? "selected" : ""}>${r}</option>`).join("")}</select>
      <button class="btn primary" data-whosave>Save</button></div>`;
  }

  // ---------- helpers ----------
  function minsLeft(p) { return SLA - p.received_min - (Date.now() - LOADED) / 60000 }
  function clock(p) {
    const d = decisions()[p.id];
    if (d) return `<span class="done ${d.decision}">${{ approve: "Approved", info: "Asked for info", deny: "Denied" }[d.decision]}</span>`;
    const m = minsLeft(p), a = Math.abs(m), h = Math.floor(a / 60), mm = Math.floor(a % 60);
    const txt = m < 0 ? `overdue ${h ? h + "h " : ""}${mm}m` : `${h}h ${String(mm).padStart(2, "0")}m left`;
    return `<span class="clock ${m < 0 ? "over" : m < 30 ? "soon" : ""}" title="${p.uploaded ? "Time since upload" : "Simulated arrival time"}"><i></i>${txt}</span>`;
  }
  const SRC = { upload: "Upload", fax: "Fax", folder: "Folder", email: "Email", portal: "Portal" };
  const srcTag = p => p.uploaded ? `<span class="src ${esc(p.uploaded.source || "upload")}" title="How this referral arrived">${SRC[p.uploaded.source] || "Upload"}</span>` : "";
  function arrival(p) {
    const u = p.uploaded; if (!u) return "";
    const bits = [`Arrived by <b>${SRC[u.source] || "Upload"}</b>`];
    if (u.hospital) bits.push(`from ${esc(u.hospital)}`);
    if (u.from) bits.push(`sender ${esc(u.from)}`);
    if (u.contact) bits.push(`callback ${esc(u.contact)}`);
    if (u.subject) bits.push(`“${esc(u.subject)}”`);
    if (u.source === "portal") bits.push(u.declared_docs && u.declared_docs.length ? `hospital says it attached ${u.declared_docs.map(esc).join(", ")}` : "hospital ticked no documents");
    if (u.dry_run) bits.push("dry run");
    return `<div class="meta arrival">${bits.join(" · ")}</div>`;
  }
  const pill = p => `<span class="pill ${p.fit.band}">${p.fit.score}</span>`;
  const pg = (page, quote, label) => page == null ? "" :
    `<button class="pg" data-page="${page}" data-quote="${esc(quote || "")}" title="Open page ${page}">${label || "p" + page}</button>`;
  const vmark = v => v == null ? "" : v ? '<span class="vf" title="Quote found on this page">✓</span>' : '<span class="ck" title="Quote not found on this page, read it">check</span>';

  function arc(r, from, to, color, w, cap) {
    const c = 2 * Math.PI * r;
    return `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${color}" stroke-width="${w}"${cap ? ' stroke-linecap="round"' : ""}
      stroke-dasharray="${(c * (to - from)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(${-90 + from * 360} 80 80)"/>`;
  }
  function ring(score, band, size = 176) {
    const s = Math.max(0.001, score / 100);
    return `<svg class="gauge" width="${size}" height="${size}" viewBox="0 0 160 160" role="img" aria-label="Fit score ${score} of 100, ${band}">
      ${arc(73, 0, 0.395, "var(--bad)", 3.5)}${arc(73, 0.405, 0.695, "var(--warn)", 3.5)}${arc(73, 0.705, 1, "var(--ok)", 3.5)}
      ${arc(60, 0, 1, "var(--track)", 13)}${arc(60, 0, s, BAND[band], 13, true)}
      <text x="80" y="84" text-anchor="middle" font-size="44" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${score}</text>
      <text x="80" y="104" text-anchor="middle" font-size="10" letter-spacing="1.5" fill="var(--mute)" font-family="Montserrat, sans-serif">FIT SCORE</text></svg>`;
  }
  function dial(score, band) {
    const r = 21, c = 2 * Math.PI * r;
    return `<svg class="dial" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--track)" stroke-width="5"/>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${BAND[band]}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c * Math.max(.01, score / 100)).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 26 26)"/>
      <text x="26" y="31" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${score}</text></svg>`;
  }

  // ---------- inbox ----------
  const LANES = [["nofit", "Not a fit", "Verified hard stop found"], ["info", "Needs info", "No hard stop; open questions"], ["fit", "Likely fit", "Rules met with evidence"]];
  function card(p) {
    const d = decisions()[p.id], m = minsLeft(p);
    const used = Math.min(1, Math.max(0, (SLA - m) / SLA));
    const bl = p.fit.blockers;
    return `<button class="card2 ${p.fit.band} ${d ? "decided" : ""}" data-open="${p.id}">
      <span class="c-top"><span class="id">${p.id}</span>${srcTag(p)}${clock(p)}</span>
      <span class="c-main">${dial(p.fit.score, p.fit.band)}<span class="c-who"><b>${esc(p.patient.summary)}</b><small>${esc(p.patient.admit_reason || "")}</small></span></span>
      <span class="c-bl">${bl.length ? bl.slice(0, 3).map(x => `<span class="tagx">${esc(x)}</span>`).join("") + (bl.length > 3 ? `<span class="tagx more">+${bl.length - 3}</span>` : "") : `<span class="calm">No hard stop</span>`}</span>
      <span class="c-foot"><span class="sla ${m < 0 ? "over" : m < 30 ? "soon" : ""}" title="Share of the 2-hour window used"><i style="width:${(used * 100).toFixed(0)}%"></i></span>
        <span class="num lbl">${p.pages} pp${ui.showIhh && p.ihh ? ` · IHH ${p.ihh}` : ""}</span></span>
    </button>`;
  }
  function recap() {
    const d = decisions(), open_ = P.filter(p => !d[p.id]);
    const n = k => open_.filter(p => p.fit.band === k).length;
    const soon = open_.filter(p => minsLeft(p) < 30).length;
    if (!open_.length) return `<h1>All caught up.</h1><p class="lede">Every referral has a decision. New ones appear here as they arrive.</p>`;
    const go = (k, num, label) => `<button class="rc ${k}" data-filter="${k}"><span class="num">${num}</span>${label}</button>`;
    return `<h1>${open_.length} ${open_.length === 1 ? "referral needs" : "referrals need"} your review.</h1>
      <div class="recap">${go("fit", n("fit"), "look like a fit")}${go("nofit", n("nofit"), "do not fit")}${go("info", n("info"), "need more info or your call")}</div>
      <p class="lede">${soon ? `<b class="soon">${soon} under 30 minutes left on the 2-hour reply.</b> ` : ""}Each finding links to the page it came from. You decide; nothing is sent from here.</p>`;
  }
  function inbox() {
    const d = decisions();
    let list = P.filter(p => ui.filter === "all" || ui.filter === "open" ? (ui.filter !== "open" || !d[p.id]) : p.fit.band === ui.filter);
    if (ui.q) { const q = ui.q.toLowerCase(); list = list.filter(p => (p.id + " " + p.patient.summary + " " + (p.patient.admit_reason || "") + " " + p.fit.blockers.join(" ")).toLowerCase().includes(q)) }
    const sorters = { deadline: (a, b) => (d[a.id] ? 1 : 0) - (d[b.id] ? 1 : 0) || minsLeft(a) - minsLeft(b), score: (a, b) => a.fit.score - b.fit.score, id: (a, b) => a.id.localeCompare(b.id) };
    list.sort(sorters[ui.sort]);
    const pages = P.reduce((s, p) => s + p.pages, 0);
    const decided = Object.keys(d).filter(k => byId[k]).length;
    const urgent = P.filter(p => !d[p.id] && minsLeft(p) < 30).length;
    const lanes = LANES.filter(([k]) => ["all", "open"].includes(ui.filter) || ui.filter === k).map(([k, name, sub]) => {
      const items = list.filter(p => p.fit.band === k);
      return `<section class="lane ${k}"><header><i></i><div><b>${name}</b><small>${sub}</small></div><span class="num">${items.length}</span></header>
        <div class="cards">${items.map(card).join("") || `<div class="empty">Nothing here</div>`}</div></section>`;
    }).join("");
    return `<section class="hero2">
        <div class="h-copy">${whoBar()}
          ${recap()}</div>
        <div class="pipe">
          <div><small class="step">[01] Read</small><span class="num">${pages}</span><small>faxed pages</small></div>
          <div><small class="step">[02] Check</small><span class="num">${P.length}</span><small>one-page reviews</small></div>
          <div class="hot"><small class="step">[03] Decide</small><span class="num">${decided}<em>/${P.length}</em></span><small>${urgent} under 30 min left</small></div>
        </div></section>
      <div class="tools">
        <div class="seg" role="tablist">${[["all", "All"], ["open", "Open"], ["nofit", "Not a fit"], ["info", "Needs info"], ["fit", "Likely fit"]].map(([k, l]) => `<button data-filter="${k}" class="${ui.filter === k ? "on" : ""}">${l}</button>`).join("")}</div>
        <input class="search" id="q" type="search" placeholder="Search patient, diagnosis or rule ID" value="${esc(ui.q)}" aria-label="Search">
        <select class="sort" id="sort" aria-label="Sort">${[["deadline", "Sort: deadline"], ["score", "Sort: lowest score"], ["id", "Sort: packet ID"]].map(([k, l]) => `<option value="${k}" ${ui.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${APP.meta.real ? `<label class="toggle"><input type="checkbox" id="ihh" ${ui.showIhh ? "checked" : ""}> show IHH decision</label>` : ""}
      </div>
      ${dropzone()}
      <div class="board">${lanes}</div>
      <p class="foot">Countdowns use simulated arrival times. Fit score is rule-based: a verified blocker caps it at 15; unknowns lower it. Weights were hand-tuned on IHH’s 11 past decisions, so it guides the coordinator and does not decide. ${esc(APP.meta.note || "")}</p>`;
  }

  // ---------- intake (only with src/desk_server.py running on this computer) ----------
  const STEP_NAMES = { fix: "Straighten pages", transcribe: "Read every page", check: "Check IHH rules", score: "Verify quotes, score", build: "Add to inbox" };
  function dropzone() {
    const s = ui.server; if (!s) return "";
    const jobs = (ui.jobs || []).slice().reverse().map(j => {
      const at = j.steps.indexOf(j.stage);
      return `<div class="job ${j.state}"><div class="j-top"><b>${esc(j.id)}</b><span class="src">${esc(j.source)}</span><span>${esc(j.name)}</span>${j.dry_run ? `<span class="tagx">dry run</span>` : ""}
          ${j.state === "done" ? `<button class="btn" data-open="${j.id}">Open ${j.id}</button>` : ""}</div>
        <ol class="j-steps">${j.steps.map((k, i) => `<li class="${j.state === "done" || i < at ? "ok" : i === at ? (j.state === "error" ? "bad" : "now") : ""}">${STEP_NAMES[k]}</li>`).join("")}</ol>
        <p class="lbl">${esc(j.msg || "")}</p></div>`;
    }).join("");
    return `<section class="intake"><label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
        <b>Drop new referral PDFs here</b><small>or click to choose. One or more files, each becomes a referral. It is processed on this computer and saved in output/, which is never committed.${s.dry_run ? " DRY RUN: only the fictional F01 to F09 PDFs, with prepared results." : ""}</small></label>
      <p class="lbl channels">Also arriving here: <b>Fax</b> (fax service webhook) · <b>Email</b> to ${esc(s.email || "the intake address")} · <b>Folder</b> (files saved in the intake folder) · <b>Hospital portal</b> <a href="/portal" target="_blank" rel="noopener">open /portal</a></p>
      ${s.key ? "" : `<p class="lbl warn">No API key: start the server with ANTHROPIC_API_KEY set.</p>`}
      ${ui.uploadError ? `<p class="lbl warn">${esc(ui.uploadError)}</p>` : ""}${jobs}</section>`;
  }
  async function upload(list) {
    const files = [...(list || [])], errs = [];
    ui.uploadError = null;
    if (!files.length) return;
    for (const file of files) {
      if (!/\.pdf$/i.test(file.name)) { errs.push(`${file.name}: not a PDF`); continue }
      try {
        const r = await fetch("/api/upload", { method: "POST", headers: { "Content-Type": "application/pdf", "X-Filename": encodeURIComponent(file.name) }, body: file });
        const j = await r.json(); if (!r.ok) errs.push(`${file.name}: ${j.error || "upload failed"}`);
      } catch (e) { errs.push("The local server is not answering."); break }
    }
    ui.uploadError = errs.join(" · ") || null;
    if (errs.length) render();
    poll();
  }
  async function poll() {
    try { ui.jobs = await (await fetch("/api/jobs", { cache: "no-store" })).json() } catch (e) { return }
    const fresh = ui.jobs.find(j => j.state === "done" && !byId[j.id]);
    const busy = ui.jobs.some(j => j.state === "running");
    if (fresh && !busy) { location.hash = "#/" + fresh.id; return location.reload() }  // new packets are in the rebuilt page
    if (!route()) { const y = scrollY; render(); scrollTo(0, y) }
    if (ui.jobs.some(j => j.state === "running")) setTimeout(poll, 1500);
  }
  if (!APP.meta.artifact && location.protocol.startsWith("http") && APP.meta.real) {
    fetch("/api/ping", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => { if (j && j.ok) { ui.server = j; poll() } }).catch(() => {});
  }
  document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over") } });
  document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over") });
  document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); upload(e.dataTransfer.files) } });

  // ---------- review ----------
  function chip(r) {
    const e = (r.evidence || [])[0];
    const pages = [...new Set((r.evidence || []).map(x => x.page))].map(x => "p" + x).join(" ");
    return `<button class="chip ${r.status}" data-rule="${r.rule_id}" title="${esc(r.rule_id + ": " + r.text + "\n\n" + (r.finding || ""))}">${ICON[r.status] || ""} <span class="rid">${r.rule_id}</span>${esc(r.short)}${pages ? ` <span class="num" style="opacity:.7">${pages}</span>` : ""}${(r.evidence || []).length && !r.verified ? ' <span class="ck">check</span>' : ""}</button>`;
  }
  function sbar(rs) {
    const n = rs.length, w = k => (100 * rs.filter(r => r.status === k).length / n).toFixed(1);
    return `<span class="sbar" aria-hidden="true"><i class="met" style="width:${w("met")}%"></i><i class="unknown" style="width:${(+w("unknown") + +w("cant_tell")).toFixed(1)}%"></i><i class="not_met" style="width:${w("not_met")}%"></i></span>`;
  }
  function criteria(p) {
    const shown = p.rules.filter(r => r.status !== "not_applicable" && !r.superseded_by);
    const order = ["General", "ADLs", "Mobility", "Mental Health", "Cognition", "Other Factors", "End of life care", "Infection Control", "Infection", "Diabetes", "Respiratory Illness", "Cardiac"];
    const g = {}; shown.forEach(r => (g[r.section] = g[r.section] || []).push(r));
    const secs = [...order.filter(s => g[s]), ...Object.keys(g).filter(s => !order.includes(s)).sort()];
    const rank = { not_met: 0, unknown: 1, cant_tell: 2, met: 3 };
    const c = k => shown.filter(r => r.status === k).length;
    return `<div class="card crit"><h2>Criteria check <span class="legend">✓ ${c("met")} met · ✕ ${c("not_met")} not met · ? ${c("unknown")} unknown · ⌛ ${c("cant_tell")} can't tell · ${p.rules.length - shown.length} not applicable hidden</span></h2>
      ${secs.map(s => `<div class="sec"><div class="n">${esc(s)}${sbar(g[s])}</div><div class="chips">${g[s].sort((a, b) => rank[a.status] - rank[b.status]).map(chip).join("")}</div></div>`).join("")}</div>`;
  }
  function review(p) {
    const rules = Object.fromEntries(p.rules.map(r => [r.rule_id, r]));
    const facts = (p.key_facts || []).map(f => `<li><span class="k">${esc(f.label)}</span><span>${esc(f.text)} ${(f.pages || []).map(x => pg(x, x === f.quote_page ? f.quote : "")).join(" ")}${vmark(f.verified)}</span></li>`).join("");
    let blocks = p.fit.blockers.map(id => {
      const r = rules[id] || { short: "No general eligibility criterion met", finding: "", evidence: [] };
      const e = (r.evidence || [])[0];
      return `<div class="block"><b>⛔ ${esc(id)} · ${esc(r.short)}</b><div>${esc(r.finding)}</div>${e ? `<div><span class="q">"${esc(e.quote)}"</span> ${pg(e.page, e.quote)}${vmark(e.verified)}</div>` : ""}</div>`;
    }).join("");
    blocks += p.fit.possible_blockers.map(id => `<div class="block maybe"><b>⚠ Possible: ${esc(id)} · ${esc(rules[id].short)}</b><div>${esc(rules[id].finding)}</div><div class="ck">evidence not verified, read the page</div></div>`).join("");
    if (!blocks) blocks = `<div class="clear">No verified blockers found</div>`;
    const confs = (p.conflicts || []).map(c => `<div class="conf"><b>${esc(c.topic)}</b> · ${esc(c.note)} ${(c.sources || []).map(s => pg(s.page, s.quote) + vmark(s.verified)).join(" ")}</div>`).join("") || `<div class="lbl">None found</div>`;
    const missing = (p.documents || []).filter(d => d.present === "no").map(d => `<span>${esc(d.name || d.doc_id)}</span>`).join("") || `<span class="lbl" style="background:none">Nothing from the checklist</span>`;
    const cf = p.claude_fit || {};
    const reasons = (p.fit.reasons || []).map(r => `<li>${r.points} ${esc(r.why)}</li>`).join("");
    return `<div class="title band-${p.fit.band}"><div><p class="eyebrow">${esc(p.id)} · ${p.pages} faxed pages · ${esc(p.fit.label)}</p><h1>${esc(p.id)} · ${esc(p.patient.summary)}</h1>
        <div class="meta">${p.pages} pages · ${esc(p.patient.insurance || "")} · Housing: ${esc(p.patient.housing || "")} · Admitted for: ${esc(p.patient.admit_reason || "")} ${(p.patient.pages || []).map(x => pg(x)).join(" ")}</div>${arrival(p)}</div>
        <div class="meta">${clock(p)} ${ui.showIhh && p.ihh ? `<span class="ihh">· IHH decided: ${p.ihh}</span>` : ""}</div></div>
      <div class="grid3">
        <div class="card"><h2>Key facts <small>click a page to see it</small></h2><ul class="facts">${facts}</ul></div>
        <div class="card ringbox">${ring(p.fit.score, p.fit.band)}<div class="band" style="color:${BAND[p.fit.band]}">${esc(p.fit.label)}</div>${proof(p)}
          <div class="second">Claude's read: <b>${esc(cf.score ?? "–")}/100 · ${esc(String(cf.recommendation || "").replace("_", " "))}</b><br>${esc(cf.reason || "")}</div>
          ${reasons ? `<details class="why"><summary>How the score was built</summary><ul><li>start 100</li>${reasons}${p.fit.blockers.length ? "<li>verified blocker: capped at 15</li>" : "<li>no blocker: floor 40</li>"}</ul></details>` : ""}</div>
        <div class="card"><h2>Blockers</h2>${blocks}<h2 style="margin-top:12px">Form vs chart</h2>${confs}</div>
      </div>
      <div class="stack">${criteria(p)}</div>
      <div class="two"><div class="card"><h2>Missing from packet</h2><div class="miss">${missing}</div></div>
        <div class="card"><h2>Ask the hospital <small>${(p.questions || []).length} questions</small></h2><ol class="qs">${(p.questions || []).map(q => `<li>${esc(q)}</li>`).join("") || "<li>No open questions</li>"}</ol></div></div>
      <p class="foot">✓ next to a page means the quote was found on that page (${p.verification.verified}/${p.verification.quotes} criteria quotes verified). "check" means read the page yourself. Transcripts are AI-made from the scans.</p>`;
  }

  function proof(p) {
    const v = p.verification, files = !APP.meta.artifact;
    const link = (href, name, sub) => href && files ? `<a class="pf" href="${href}" target="_blank" rel="noopener"><b>${name}</b><small>${sub}</small></a>` : "";
    return `<div class="proof"><p class="eyebrow">Proof behind the score</p>
      <div class="pf-row">${link(p.pdf, "Original PDF", `${p.pages} pages as faxed`)}${link(p.readable, "Readable PDF", "each page beside its transcript")}${link(p.fitlist, "Fit checklist", "every IHH rule, status and page")}${link(p.criteria, "IHH criteria", "IHH’s own admission rules")}${link(p.docx, "Word copy", "compact, in the form styles")}</div>
      ${files ? "" : `<p class="lbl">The files open in the GitHub Pages or local version of this app.</p>`}
      <p class="pf-check"><span class="vf">✓</span> ${v.verified}/${v.quotes} quotes found on the page they cite</p></div>`;
  }

  // ---------- evidence panel ----------
  function panel(p) {
    const s = ui.panel; if (!s) return "";
    const pageObj = p.page_list.find(x => x.page === s.page) || p.page_list[0];
    const i = p.page_list.indexOf(pageObj);
    let text = esc(pageObj.text);
    if (s.quote) {
      const q = esc(s.quote).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/\s+/g, "\\s+");
      text = text.replace(new RegExp(q, "i"), m => `<mark id="hit">${m}</mark>`);
    }
    text = text.replace(/^## (.*)$/gm, "<b>$1</b>").replace(/^- /gm, "• ");
    const img = p.img ? p.img.replace("{nn}", String(pageObj.page).padStart(2, "0")) : null;
    const pdf = p.pdf && !APP.meta.artifact ? p.pdf : null;
    const tabs = [pdf && ["pdf", "Original PDF"], img && ["scan", "Scan image"], ["text", "Transcript"]].filter(Boolean);
    const tab = s.tab && tabs.some(t => t[0] === s.tab) ? s.tab : tabs[0][0];
    const r = s.rule ? p.rules.find(x => x.rule_id === s.rule) : null;
    return `<aside class="panel" aria-label="Evidence">
      <div class="ph"><b>Page ${pageObj.page} of ${p.pages}</b><span class="lbl">${esc(pageObj.title)}</span><span class="sp"></span>
        <button data-nav="-1" ${i <= 0 ? "disabled" : ""} aria-label="Previous page">◀</button><button data-nav="1" ${i >= p.page_list.length - 1 ? "disabled" : ""} aria-label="Next page">▶</button>
        <button data-close aria-label="Close">✕</button></div>
      ${r ? `<div class="rulebox"><span class="chip ${r.status}">${ICON[r.status] || ""} <span class="rid">${r.rule_id}</span>${esc(r.short)}</span><div class="t">${esc(r.finding)}</div><div class="t" style="font-size:11.5px">Rule: ${esc(r.text)}</div></div>` : ""}
      <div class="body">${tabs.length > 1 ? `<div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>` : `<div class="lbl" style="margin-bottom:8px">Transcript of the packet page.</div>`}
        ${tab === "pdf" ? `<iframe class="pdfv" src="${pdf}#page=${pageObj.page}&view=FitH" title="Original PDF, page ${pageObj.page}"></iframe>${s.quote ? `<p class="lbl">Looking for: <mark>${esc(s.quote)}</mark></p>` : ""}`
          : tab === "scan" ? `<img src="${img}" alt="Original scan of page ${pageObj.page}">${s.quote ? `<p class="lbl">Looking for: <mark>${esc(s.quote)}</mark></p>` : ""}` : `<pre>${text}</pre>`}</div></aside>`;
  }

  // ---------- decision ----------
  function draft(p, kind) {
    const rules = Object.fromEntries(p.rules.map(r => [r.rule_id, r]));
    const head = `Re: recuperative care referral ${p.id} (${p.patient.summary})\n\nThank you for the referral. Illumination Health + Home has reviewed the packet.\n\n`;
    const qs = (p.questions || []).map((q, i) => `${i + 1}. ${q}`).join("\n");
    if (kind === "deny") return head + "We are not able to accept this patient at this time, based on:\n" +
      (p.fit.blockers.filter((id, _, all) => !(id.startsWith("FORM-") && all.some(x => !x.startsWith("FORM-")))).map(id => `- ${(rules[id] || {}).short || id}${(rules[id] && rules[id].evidence[0]) ? ` (packet p${rules[id].evidence[0].page})` : ""}`).join("\n") || "- [reason]") +
      "\n\nIf the patient's status has changed, please send updated notes and we will review again.\n\n" + sign();
    if (kind === "info") return head + "To finish our review we need the following:\n" + (qs || "1. [question]") + "\n\nWe will reply as soon as we receive them.\n\n" + sign();
    return head + "We can accept this patient for recuperative care." + (qs ? "\n\nBefore discharge, please confirm:\n" + qs : "") + "\n\nPlease call to arrange transport and arrival time.\n\n" + sign();
  }
  function decideBar(p) {
    const d = decisions()[p.id], k = ui.drawer || (d && d.decision);
    const text = ui.drawer ? (ui.draftText ?? draft(p, ui.drawer)) : d ? d.text : "";
    return `<div class="decide"><div class="decide-in gutter">
        <span class="lead">${d ? `Decided: <b>${{ approve: "Approve", info: "Ask for info", deny: "Deny" }[d.decision]}</b> · ${new Date(d.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}${d.by ? ` · by ${esc(d.by)}` : ""}` :"Your decision drafts the reply to the hospital. Nothing is sent from here."}</span>
        <button class="btn approve ${k === "approve" ? "on" : ""}" data-decide="approve">Approve</button>
        <button class="btn info ${k === "info" ? "on" : ""}" data-decide="info">Ask for info</button>
        <button class="btn deny ${k === "deny" ? "on" : ""}" data-decide="deny">Deny</button>
        <button class="btn" data-next>Next ▸</button></div>
      ${ui.drawer ? `<div class="drawer gutter"><textarea id="reply" aria-label="Reply to hospital">${esc(text)}</textarea>
        <div class="row2"><span class="hint">Edit as needed, then copy it into your fax or email system.</span>
          <button class="btn" data-copy>Copy reply</button><button class="btn primary" data-save>Save decision</button><button class="btn" data-cancel>Cancel</button></div></div>` : ""}</div>`;
  }

  // ---------- render + routing ----------
  function route() { const m = location.hash.match(/^#\/?([A-Z]\d\d)?$/); return m && m[1] && byId[m[1]] ? m[1] : null }
  function render() {
    if (!session) { $("#crumb").innerHTML = ""; $("#main").innerHTML = loginView(); $("#dock").innerHTML = ""; return }
    const id = route(), p = id && byId[id];
    $("#crumb").innerHTML = p ? `<a href="#/">Inbox</a> <span>›</span> <span>${p.id}</span>` : `<span>Inbox</span>`;
    const main = $("#main");
    if (!p) { main.innerHTML = inbox(); $("#dock").innerHTML = ""; return }
    main.innerHTML = `<div class="review ${ui.panel ? "withpanel" : ""}"><div>${review(p)}</div>${panel(p)}</div>`;
    $("#dock").innerHTML = decideBar(p);
    const hit = document.getElementById("hit"); if (hit) hit.scrollIntoView({ block: "center" });
  }
  function open(id) { ui.panel = null; ui.drawer = null; ui.draftText = null; location.hash = "#/" + id }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-open]"); if (!t) return;
    const p = byId[route()];
    if (t.dataset.open) return open(t.dataset.open);
    if (t.dataset.filter) { ui.filter = t.dataset.filter; return render() }
    if (t.dataset.page) { ui.panel = { page: +t.dataset.page, quote: t.dataset.quote, tab: null }; return render() }
    if (t.dataset.rule && p) {
      const r = p.rules.find(x => x.rule_id === t.dataset.rule), ev = (r.evidence || [])[0];
      ui.panel = { page: ev ? ev.page : (ui.panel ? ui.panel.page : p.page_list[0].page), quote: ev ? ev.quote : "", rule: r.rule_id }; return render();
    }
    if (t.dataset.nav && p) { const i = p.page_list.findIndex(x => x.page === ui.panel.page) + +t.dataset.nav; ui.panel = { page: p.page_list[i].page, tab: ui.panel.tab }; return render() }
    if (t.dataset.tab) { ui.panel.tab = t.dataset.tab; return render() }
    if ("close" in t.dataset) { ui.panel = null; return render() }
    if (t.dataset.decide && p) { ui.drawer = t.dataset.decide; ui.draftText = null; render(); const ta = $("#reply"); if (ta) ta.focus(); return }
    if ("cancel" in t.dataset) { ui.drawer = null; return render() }
    if ("copy" in t.dataset) {
      const ta = $("#reply");
      const done = () => { t.textContent = "Copied"; setTimeout(() => (t.textContent = "Copy reply"), 1500) };
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); t.textContent = "Press Ctrl+C" }) } catch (err) { ta.select(); t.textContent = "Press Ctrl+C" }
      return;
    }
    if ("save" in t.dataset && p) { const v = { ...decisions() }; v[p.id] = { decision: ui.drawer, text: $("#reply").value, at: Date.now(), by: `${who.name} (${who.role})` }; store.set(v); ui.drawer = null; return render() }
    if ("next" in t.dataset && p) {
      const d = decisions(), open_ = P.filter(x => !d[x.id] && x.id !== p.id).sort((a, b) => minsLeft(a) - minsLeft(b));
      return open_.length ? open(open_[0].id) : (location.hash = "#/");
    }
    if ("theme" in t.dataset) { const r = document.documentElement, cur = r.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; return }
    if ("reset" in t.dataset) { store.set({}); return render() }
    if ("who" in t.dataset) { ui.editWho = true; render(); const n = $("#who-name"); if (n) n.focus(); return }
    if ("whosave" in t.dataset) {
      who = { name: ($("#who-name").value.trim() || "Staff").slice(0, 60), role: $("#who-role").value };
      try { localStorage.setItem("referral-desk-user:" + session.email, JSON.stringify(who)) } catch (e) { /* private mode: keep in memory */ }
      ui.editWho = false; return render();
    }
    if ("signout" in t.dataset) { session = null; try { sessionStorage.removeItem("referral-desk-session") } catch (e) { /* ok */ } location.hash = "#/"; return render() }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "q") { ui.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos) }
    if (e.target.id === "reply") ui.draftText = e.target.value;
  });
  document.addEventListener("change", e => {
    if (e.target.id === "sort") { ui.sort = e.target.value; render() }
    if (e.target.id === "ihh") { ui.showIhh = e.target.checked; render() }
    if (e.target.id === "file") { upload(e.target.files); e.target.value = "" }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (ui.drawer) ui.drawer = null; else if (ui.panel) ui.panel = null; else if (route()) location.hash = "#/"; render() }
  });
  addEventListener("hashchange", () => { ui.panel = null; ui.drawer = null; render(); scrollTo(0, 0) });
  setInterval(() => { if (!document.activeElement || !["q", "reply", "l-email", "l-pass", "who-name"].includes(document.activeElement.id)) { const y = scrollY; render(); scrollTo(0, y) } }, 30000);
  render();
})();
</script>
</html>
