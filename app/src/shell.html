<title>Referral Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700;800&display=swap">
<!--STYLE-->
<header class="bar"><div class="bar-in gutter">
  <a class="logo" href="#/" style="text-decoration:none"><b>OCMEE</b><i>DESIGN</i><span>Referral Desk for Illumination Health + Home</span></a>
  <nav class="crumb" id="crumb"></nav><span class="sp"></span>
  <span class="tag" id="mode"></span>
  <button class="iconbtn" data-theme title="Switch light or dark">◐ Theme</button>
</div></header>
<div class="notice gutter" id="notice"></div>
<main class="gutter" id="main"></main>
<div id="dock"></div>
<!--DATA-->
<script>
  (function () { var m = (window.APP && window.APP.meta) || {}; var t = document.getElementById("mode");
    if (m.real) { t.textContent = "Real packets · local only"; t.classList.add("real") } else t.remove();
    if (m.banner) document.getElementById("notice").innerHTML = "<div>" + m.banner + "</div>"; })();
</script>
<!--SCRIPT-->
